<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="타일을 밀어 씨앗을 숲으로 키우는 퍼즐">
  <title>작은 숲 키우기</title>
  <link rel="icon" href="preview.svg" type="image/svg+xml">
  <script>
    // 첫 페인트 전에 블로그에서 고른 테마를 적용해 깜빡임을 막는다.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="ui.js"></script>
</head>
<body>
  <!-- 타일과 범례에서 재사용하는 그림 -->
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="stage-1" viewBox="0 0 48 48">
      <path fill="currentColor" d="M24 7c8 8 13 15 13 23a13 13 0 0 1-26 0c0-8 5-15 13-23z"/>
    </symbol>
    <symbol id="stage-2" viewBox="0 0 48 48">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M24 42V22M14 42h20"/>
      <path fill="currentColor" d="M24 27C24 17 16 12 7 12c0 10 7 15 17 15zM24 22c0-9 7-14 17-14 0 10-7 14-17 14z"/>
    </symbol>
    <symbol id="stage-3" viewBox="0 0 48 48">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M24 45V14"/>
      <path fill="currentColor" d="M24 36c-2-7-8-10-16-10 1 7 8 11 16 10zM24 36c2-7 8-10 16-10-1 7-8 11-16 10zM24 25c-1-6-6-9-13-9 1 6 6 10 13 9zM24 25c1-6 6-9 13-9-1 6-6 10-13 9zM24 16c-4-4-4-9 0-13 4 4 4 9 0 13z"/>
    </symbol>
    <symbol id="stage-4" viewBox="0 0 48 48">
      <rect fill="currentColor" x="21" y="26" width="6" height="19" rx="1.5"/>
      <circle fill="currentColor" cx="24" cy="14" r="11"/>
      <circle fill="currentColor" cx="13.5" cy="23" r="9.5"/>
      <circle fill="currentColor" cx="34.5" cy="23" r="9.5"/>
    </symbol>
    <symbol id="stage-5" viewBox="0 0 48 48">
      <g fill="currentColor" opacity="0.62">
        <path d="M10 15l7 11h-3.5l6 9H.5l6-9H3z"/>
        <path d="M38 15l-7 11h3.5l-6 9h19l-6-9H45z"/>
        <rect x="8.5" y="35" width="3" height="8"/>
        <rect x="36.5" y="35" width="3" height="8"/>
      </g>
      <path fill="currentColor" d="M24 4l10 15h-5l8 13H11l8-13h-5z"/>
      <rect fill="currentColor" x="22" y="32" width="4" height="12"/>
    </symbol>
    <symbol id="stone" viewBox="0 0 48 48">
      <path fill="currentColor" fill-opacity="0.55" d="M13 12l14-6 13 9 4 16-12 11-19-2-9-13z"/>
      <path fill="currentColor" d="M13 12l14-6 13 9-9 8-14-1zM17 22l14 1 1 19-19-2z"/>
    </symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <h1 class="app-title">작은 숲 키우기</h1>
      <a class="back-link" href="../../">← 블로그로</a>
    </header>

    <main class="layout">
      <div class="board-wrap">
        <div id="board" class="board" role="group" aria-label="숲터 5×5">
          <div id="cells" class="cells" aria-hidden="true"></div>
          <div id="tiles" class="tiles" aria-hidden="true"></div>
        </div>
        <p id="notice" class="notice" hidden></p>
        <div id="over" class="over" hidden>
          <h2 class="over-title">더 자랄 자리가 없어요</h2>
          <p id="over-score" class="over-score"></p>
          <p id="over-record" class="over-record" hidden>새 최고 기록</p>
          <button id="over-new" class="button primary" type="button">새 게임</button>
        </div>
      </div>

      <div class="panel">
        <dl class="scores">
          <div class="score-item">
            <dt>점수</dt>
            <dd id="score">0</dd>
          </div>
          <div class="score-item">
            <dt>최고 기록</dt>
            <dd id="best">0</dd>
          </div>
          <div class="score-item">
            <dt>연속 보너스</dt>
            <dd id="bonus">-</dd>
          </div>
        </dl>

        <div class="stone-meter">
          <p id="stone-text" class="stone-text"></p>
          <div id="stone-ticks" class="stone-ticks" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <div class="dir-buttons">
            <button class="button" type="button" data-dir="left" aria-label="왼쪽으로 밀기">←</button>
            <button class="button" type="button" data-dir="up" aria-label="위쪽으로 밀기">↑</button>
            <button class="button" type="button" data-dir="down" aria-label="아래쪽으로 밀기">↓</button>
            <button class="button" type="button" data-dir="right" aria-label="오른쪽으로 밀기">→</button>
          </div>
          <div class="action-buttons">
            <button id="new-game" class="button" type="button">새 게임</button>
            <button id="read-board" class="button" type="button">보드 읽기</button>
          </div>
        </div>

        <section class="legend-section" aria-label="성장 단계">
          <ol class="legend">
            <li class="legend-item">
              <span class="legend-swatch stage-1"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#stage-1"/></svg></span>
              <span>1 씨앗</span>
            </li>
            <li class="legend-item">
              <span class="legend-swatch stage-2"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#stage-2"/></svg></span>
              <span>2 새싹</span>
            </li>
            <li class="legend-item">
              <span class="legend-swatch stage-3"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#stage-3"/></svg></span>
              <span>3 묘목</span>
            </li>
            <li class="legend-item">
              <span class="legend-swatch stage-4"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#stage-4"/></svg></span>
              <span>4 나무</span>
            </li>
            <li class="legend-item">
              <span class="legend-swatch stage-5"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#stage-5"/></svg></span>
              <span>5 숲</span>
            </li>
          </ol>
          <p class="help">방향키나 스와이프로 밀어요. 돌 바로 옆에서 합치면 돌이 부서져요.</p>
        </section>
      </div>
    </main>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>

  <noscript>
    <p>이 게임은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
